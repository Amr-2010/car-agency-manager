<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>سيارات حسب ميزانيتك | Car Agency</title><style>
*{box-sizing:border-box}body{margin:0;background:#090c12;color:#fff;font-family:system-ui,Tahoma,Arial,sans-serif;padding:1cm 16px}main{max-width:1300px;margin:auto}a{color:inherit;text-decoration:none}.back,button{background:linear-gradient(145deg,#ff2045,#b90027);color:#fff;border:0;border-radius:12px;padding:12px 20px;box-shadow:0 5px 0 #760b1c,0 13px 20px #0008;cursor:pointer;font:inherit;font-weight:750}.back{display:inline-block;margin-bottom:25px}h1{font-size:clamp(26px,4vw,40px)}.muted{color:#b5c0ce}.panel,.car{background:linear-gradient(155deg,#242c3a,#111620);border:1px solid #3d4757;border-radius:17px;padding:20px;box-shadow:0 13px 27px #0009,inset 0 2px 0 #ffffff18}.fields{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px;align-items:end}label{display:block;margin-bottom:8px;color:#ccd4de}input,select{width:100%;padding:12px;background:#0d121b;color:#fff;border:1px solid #566171;border-radius:10px;font:inherit}.result{margin:25px 0}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:15px}.car{min-width:0;padding:12px}.car img{width:100%;height:175px;object-fit:cover;border-radius:10px}.car h3{font-size:17px}.price{font-size:20px;font-weight:800;color:#ff3656}.details{display:inline-block;background:#c9002a;padding:9px 12px;border-radius:9px;margin-top:10px}.error{color:#ff879a}@media(max-width:850px){.fields{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:700px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.car img{height:110px}.car h3{font-size:14px}.price{font-size:16px}.panel{padding:14px}}
</style></head><body><main><a class="back" href="/">العودة للرئيسية</a><h1>ابحث عن سيارة حسب ميزانيتك</h1><p class="muted">حدد المقدم والقسط الشهري الذي يناسبك، وسنعرض السيارات المنشورة التي تتوافق مع التمويل التقديري.</p><section class="panel"><form id="form" class="fields"><div><label for="down">المقدم بالجنيه</label><input id="down" type="number" min="0" value="300000" required></div><div><label for="monthly">أقصى قسط شهري بالجنيه</label><input id="monthly" type="number" min="1" value="15000" required></div><div><label for="months">مدة التمويل</label><select id="months"><option value="12">سنة</option><option value="24">سنتان</option><option value="36">3 سنوات</option><option value="48">4 سنوات</option><option value="60" selected>5 سنوات</option><option value="72">6 سنوات</option><option value="84">7 سنوات</option></select></div><div><label for="rate">فائدة سنوية تقديرية %</label><input id="rate" type="number" min="0" max="100" step=".1" value="18" required></div><button type="submit">ابحث عن سيارات</button></form><p id="limit" class="muted"></p><p class="muted">الأرقام تقديرية بفائدة متناقصة ولا تشمل الرسوم أو التأمين. التمويل الفعلي يخضع لشروط جهة التمويل.</p></section><h2>السيارات المناسبة</h2><p id="status" class="muted"></p><div id="results" class="grid"></div></main><script>
const $=id=>document.getElementById(id);let cars=[];const money=n=>Math.round(n).toLocaleString('ar-EG')+' ج.م';function cap(){const d=Number($('down').value),p=Number($('monthly').value),n=Number($('months').value),rate=Number($('rate').value);if(!Number.isFinite(d)||!Number.isFinite(p)||!Number.isFinite(rate)||d<0||p<=0||rate<0||rate>100)return null;const r=rate/1200;return d+(r?p*(1-Math.pow(1+r,-n))/r:p*n)}function render(){const max=cap(),out=$('results');out.replaceChildren();if(max===null){$('status').textContent='راجع المقدم والقسط والفائدة.';$('limit').textContent='';return}$('limit').textContent='الحد الأقصى التقديري لسعر السيارة: '+money(max);const matches=cars.filter(v=>Number(v.price)>0&&Number(v.price)<=max).sort((a,b)=>Number(b.price)-Number(a.price));$('status').textContent=matches.length?'عدد السيارات المناسبة: '+matches.length:'لا توجد سيارات منشورة مطابقة لهذه الميزانية حاليًا.';for(const v of matches){const c=document.createElement('article');c.className='car';if(v.imageUrl&&/^https:\/\//i.test(v.imageUrl)){const img=document.createElement('img');img.src=v.imageUrl;img.loading='lazy';img.alt='صورة السيارة';c.append(img)}const h=document.createElement('h3');h.textContent=[v.make,v.model,v.year].filter(Boolean).join(' ');const p=document.createElement('div');p.className='price';p.textContent=money(Number(v.price));const a=document.createElement('a');a.className='details';a.href='/car-details.html?type=vehicle&id='+encodeURIComponent(v.id);a.textContent='عرض التفاصيل';c.append(h,p,a);out.append(c)}}$('form').onsubmit=e=>{e.preventDefault();render()};async function load(){try{const response=await fetch('/api/public/vehicles?pageSize=100',{signal:AbortSignal.timeout(12000)});if(!response.ok)throw Error('HTTP '+response.status);const data=await response.json();cars=Array.isArray(data)?data:Array.isArray(data.items)?data.items:Array.isArray(data.vehicles)?data.vehicles:[];render()}catch(e){$('status').textContent='تعذر تحميل السيارات من الخدمة. حاول لاحقًا.'}}load();
</script></body></html>
