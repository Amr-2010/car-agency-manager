<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تفاصيل السيارة | Car Agency</title><style>
*{box-sizing:border-box}body{margin:0;background:#090c12;color:#fff;font-family:system-ui,Tahoma,Arial,sans-serif;padding:1cm 15px}main{max-width:1100px;margin:auto}.back{color:#fff;text-decoration:none;background:#d4002a;border-radius:10px;padding:11px 20px;display:inline-block;margin-bottom:24px}.layout{display:grid;grid-template-columns:1.1fr 1fr;gap:25px}.panel{background:#171b25;border:1px solid #303744;border-radius:16px;padding:20px;min-width:0}h1{font-size:clamp(24px,4vw,38px);margin:0 0 20px}.price{color:#ff2149;font-size:27px;font-weight:800}.photo{width:100%;max-height:450px;object-fit:cover;border-radius:12px;background:#252b36}.thumbs{display:flex;flex-wrap:wrap;gap:9px;margin-top:12px}.thumbs img{width:90px;height:65px;object-fit:cover;cursor:pointer;border-radius:7px;border:1px solid #566072}.field{display:flex;justify-content:space-between;gap:15px;border-bottom:1px solid #323845;padding:12px 0}.field span{color:#b7c1cf}.desc{white-space:pre-wrap;line-height:1.8;overflow-wrap:anywhere}.contact{display:flex;flex-wrap:wrap;gap:12px;margin-top:24px}.contact a{background:#d4002a;color:white;text-decoration:none;padding:13px 20px;border-radius:10px}.muted{color:#aeb9c9}#error{color:#ff647c}@media(max-width:700px){.layout{grid-template-columns:1fr}.panel{padding:13px}body{padding:1cm 12px}}
</style></head><body><main><a class="back" href="/">العودة للرئيسية</a><h1 id="title">جارٍ تحميل تفاصيل السيارة...</h1><p id="error"></p><div class="layout" id="layout" hidden><section class="panel"><img class="photo" id="mainPhoto" alt="صورة السيارة" hidden><div id="noPhoto" class="muted">لا توجد صور متاحة</div><div id="thumbs" class="thumbs"></div></section><section class="panel"><div id="price" class="price"></div><div id="fields"></div><h2>وصف السيارة</h2><p id="desc" class="desc"></p><h2>التواصل</h2><p id="contactNote" class="muted"></p><div id="contact" class="contact"></div></section></div></main><script>
const q=new URLSearchParams(location.search),id=q.get('id'),type=q.get('type')==='used'?'used':'vehicle';
function field(label,value){if(value===null||value===undefined||value==='')return;const row=document.createElement('div');row.className='field';const a=document.createElement('span'),b=document.createElement('strong');a.textContent=label;b.textContent=value;row.append(a,b);document.getElementById('fields').append(row)}
function photo(src){if(!src)return;const main=document.getElementById('mainPhoto');if(main.hidden){main.src=src;main.hidden=false;document.getElementById('noPhoto').hidden=true}const thumb=document.createElement('img');thumb.src=src;thumb.alt='صورة إضافية للسيارة';thumb.loading='lazy';thumb.onclick=()=>main.src=src;document.getElementById('thumbs').append(thumb)}
async function load(){if(!id||!/^[0-9a-f-]{36}$/i.test(id)){document.getElementById('title').textContent='رابط السيارة غير صحيح';return}try{const endpoint=type==='used'?'/api/public/used-cars/':'/api/public/vehicles/';const r=await fetch(endpoint+encodeURIComponent(id));if(!r.ok)throw Error(r.status===404?'السيارة غير متاحة أو غير منشورة':'تعذر تحميل بيانات السيارة');const v=await r.json();document.getElementById('title').textContent=[v.make,v.model].filter(Boolean).join(' ')||'تفاصيل السيارة';document.title=document.getElementById('title').textContent+' | Car Agency';document.getElementById('price').textContent=Number(v.price||0).toLocaleString('ar-EG')+' ج.م';field('الماركة',v.make);field('الموديل',v.model);field('سنة الصنع',v.year);field('الهيكل',v.bodyType);field('الموقع',v.location);field('الحالة',type==='used'?'مستعملة':'متاحة');field('المعرض',v.branchName);document.getElementById('desc').textContent=v.description||'لا يوجد وصف إضافي لهذه السيارة';if(type==='used'){const r2=await fetch('/api/public/used-cars');if(r2.ok){const list=await r2.json();const item=list.find(x=>x.id===id);if(item?.photoId)photo('/api/public/used-cars/'+encodeURIComponent(id)+'/photos/'+encodeURIComponent(item.photoId))}if(v.phone){const digits=String(v.phone).replace(/[^\d+]/g,'');const a=document.createElement('a');a.href='tel:'+digits;a.textContent='اتصل بالمعلن: '+v.phone;document.getElementById('contact').append(a)}field('اسم المعلن',v.sellerName)}else{if(v.imageUrl&&/^https:\/\//i.test(v.imageUrl))photo(v.imageUrl);const rp=await fetch('/api/public/vehicles/'+encodeURIComponent(id)+'/photos');if(rp.ok){const urls=await rp.json();for(const url of urls)photo(url)}}if(!document.getElementById('contact').children.length)document.getElementById('contactNote').textContent='للاستفسار عن السيارة يرجى التواصل مع المعرض من خلال قنواته الرسمية.';document.getElementById('layout').hidden=false}catch(e){document.getElementById('title').textContent='تعذر عرض تفاصيل السيارة';document.getElementById('error').textContent=e.message}}load();
</script></body></html>
