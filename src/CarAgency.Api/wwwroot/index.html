<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>معارض السيارات | Car Agency</title><style>:root{font-family:system-ui,Tahoma;background:#f3f6fb;color:#182b44}*{box-sizing:border-box}body{margin:0}header{background:#fff;border-bottom:1px solid #e5e9f1;padding:20px max(5%,20px);display:flex;align-items:center;justify-content:space-between;gap:16px}a{color:#1555a0;text-decoration:none}.logo{font-size:23px;font-weight:800;color:#164e9d}header a{border:1px solid #d8e3f3;padding:10px 15px;border-radius:10px}main{max-width:1150px;margin:auto;padding:32px 20px}.hero{padding:42px;background:linear-gradient(110deg,#0c3265,#1764ba);border-radius:22px;color:#fff}.hero h1{font-size:clamp(28px,4vw,45px);margin:0 0 12px}.hero p{color:#e1eafb}.search{display:flex;gap:10px;margin:25px 0;flex-wrap:wrap}input,button{font:inherit;padding:13px;border:1px solid #d5dfeb;border-radius:10px}input{flex:1;min-width:200px}button{background:#155bb0;color:#fff;cursor:pointer;border:0}.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:20px}.card{background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 4px 20px #0b2d5412}.photo{height:180px;background:linear-gradient(135deg,#dce8f6,#f0f5fb);display:grid;place-items:center;font-size:48px}.photo img{width:100%;height:100%;object-fit:cover}.detail{padding:18px}.detail h3{margin:0 0 12px}.price{color:#155bb0;font-weight:800}.muted{color:#62748a}.error{color:#a52a2a}footer{text-align:center;color:#65758b;padding:35px}</style></head><body><header><div class="logo">🚘 Car Agency</div><a href="/admin/">دخول لوحة الإدارة</a></header><main><section class="hero"><h1>اكتشف سيارتك القادمة</h1><p>تصفح السيارات المعتمدة والمنشورة من معارض السيارات في مكان واحد</p></section><form class="search" id="search"><input id="make" placeholder="ابحث باسم الشركة المصنعة مثل Toyota"><button>بحث عن سيارة</button></form><h2>السيارات المتاحة</h2><p id="message" class="muted">جارٍ تحميل السيارات...</p><div id="cars" class="cards"></div></main><footer>Car Agency Manager © 2026</footer><script>const cars=document.getElementById('cars'),msg=document.getElementById('message');async function load(){cars.replaceChildren();msg.textContent='جارٍ تحميل السيارات...';try{const make=document.getElementById('make').value.trim();const r=await fetch('/api/public/vehicles?pageSize=48'+(make?'&make='+encodeURIComponent(make):''));if(!r.ok)throw Error('HTTP '+r.status);const items=await r.json();msg.textContent=items.length?'عدد السيارات: '+items.length:'لا توجد سيارات منشورة ومعتمدة حاليًا.';for(const v of items){const card=document.createElement('article');card.className='card';const photo=document.createElement('div');photo.className='photo';if(v.imageUrl&&/^https:\/\//i.test(v.imageUrl)){const img=document.createElement('img');img.src=v.imageUrl;img.alt='صورة سيارة';img.loading='lazy';photo.append(img)}else photo.textContent='🚗';const body=document.createElement('div');body.className='detail';const h=document.createElement('h3');h.textContent=[v.make,v.model,v.year].filter(Boolean).join(' ');const price=document.createElement('p');price.className='price';price.textContent=Number(v.price).toLocaleString('ar-EG')+' جنيه';body.append(h,price);card.append(photo,body);cars.append(card)}}catch(e){msg.className='error';msg.textContent='تعذر تحميل السيارات. تأكد من اتصال قاعدة البيانات: '+e.message}}document.getElementById('search').addEventListener('submit',e=>{e.preventDefault();load()});load();</script></body></html>
