<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مقارنة السيارات | Car Agency</title><style>*{box-sizing:border-box}body{margin:0;background:#090c12;color:#fff;font-family:system-ui,Tahoma,Arial,sans-serif;padding:1cm 15px}main{max-width:1250px;margin:auto}.back{display:inline-block;padding:12px 22px;background:#e50830;color:white;border-radius:12px;text-decoration:none;margin-bottom:24px}h1{margin:0 0 10px}.muted{color:#b5bfcc}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.car{background:linear-gradient(150deg,#252d3a,#10151e);border:1px solid #3a4556;border-radius:15px;padding:15px;min-width:0;box-shadow:0 12px 22px #0008}.car img{width:100%;height:160px;object-fit:cover;border-radius:10px}.car h3{font-size:18px;overflow-wrap:anywhere}.row{border-bottom:1px solid #3b4454;padding:12px 0;overflow-wrap:anywhere}.row span{display:block;color:#aab5c5;font-size:13px}.row b{display:block;margin-top:6px}.price{color:#ff3654}button{background:#e50830;color:white;border:0;padding:11px 16px;border-radius:10px;font:inherit;cursor:pointer;margin-top:12px}.error{color:#ff7388}@media(max-width:700px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.car{padding:10px}.car img{height:100px}}</style></head><body><main><a class="back" href="/">العودة للسيارات</a><h1>مقارنة السيارات</h1><p class="muted">اختر حتى 4 سيارات من بطاقات الموقع الرئيسية، ثم راجع الأسعار والمواصفات المتاحة.</p><p id="status" class="muted">جارٍ تحميل السيارات...</p><div id="cars" class="grid"></div><button id="clear" type="button">مسح المقارنة</button></main><script>
const key='carAgencyCompareIds',grid=document.getElementById('cars'),status=document.getElementById('status');let ids=[];try{ids=JSON.parse(sessionStorage.getItem(key)||'[]')}catch{}ids=ids.filter(x=>/^[0-9a-f-]{36}$/i.test(x)).slice(0,4);const row=(label,value)=>{const el=document.createElement('div');el.className='row';const a=document.createElement('span'),b=document.createElement('b');a.textContent=label;b.textContent=value??'غير متاح';el.append(a,b);return el};async function load(){grid.replaceChildren();if(!ids.length){status.textContent='لم تختر سيارات للمقارنة بعد. ارجع للرئيسية واضغط إضافة للمقارنة.';return}const results=await Promise.all(ids.map(async id=>{try{const r=await fetch('/api/public/vehicles/'+encodeURIComponent(id));return r.ok?await r.json():null}catch{return null}}));const cars=results.filter(Boolean);status.textContent=cars.length?'مقارنة '+cars.length+' سيارات':'السيارات المختارة غير متاحة حاليًا';for(const v of cars){const c=document.createElement('article');c.className='car';if(v.imageUrl&&/^https:\/\//i.test(v.imageUrl)){const img=document.createElement('img');img.src=v.imageUrl;img.alt=v.make+' '+v.model;c.append(img)}const h=document.createElement('h3');h.textContent=v.make+' '+v.model;c.append(h,row('السعر',Number(v.price||0).toLocaleString('ar-EG')+' ج.م'),row('سنة الصنع',v.year),row('نوع الهيكل',v.bodyType),row('المعرض / الفرع',v.branchName||v.branchId));const a=document.createElement('a');a.className='back';a.style.marginTop='15px';a.href='/car-details.html?type=vehicle&id='+encodeURIComponent(v.id);a.textContent='تفاصيل السيارة';c.append(a);grid.append(c)}}document.getElementById('clear').onclick=()=>{sessionStorage.removeItem(key);ids=[];load()};load();
</script></body></html>
