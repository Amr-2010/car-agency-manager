<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>لوحة الإدارة | Car Agency</title><style>*{box-sizing:border-box}body{font-family:system-ui,Tahoma;background:#f2f6fb;color:#20334c;margin:0}header{background:#fff;padding:20px 6%;display:flex;justify-content:space-between}main{max-width:1000px;margin:40px auto;padding:20px}.panel{background:white;border-radius:18px;padding:26px;box-shadow:0 5px 25px #142c4912}input,button{font:inherit;padding:12px;border-radius:9px;border:1px solid #cdd8e7;margin:6px}button{background:#145db1;color:#fff;cursor:pointer;border:0}input{width:min(100%,320px)}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px}.stat{background:#f0f5fb;padding:22px;border-radius:12px}table{width:100%;border-collapse:collapse;margin-top:20px}td,th{padding:12px;border-bottom:1px solid #e1e8f0;text-align:right}#dashboard{display:none}.error{color:#b32632}</style></head><body><header><strong>Car Agency | لوحة الإدارة</strong><a href="/">موقع العرض</a></header><main><section class="panel" id="login"><h1>تسجيل دخول الإدارة</h1><p>أدخل بيانات حسابك؛ يحدد النظام صلاحياتك تلقائيًا.</p><form id="loginForm"><input id="username" autocomplete="username" placeholder="اسم المستخدم" required><input id="password" type="password" autocomplete="current-password" placeholder="كلمة المرور" required><button>دخول</button></form><p id="error" class="error"></p></section><section id="dashboard"><div class="panel"><h1>لوحة التحكم</h1><button id="logout">تسجيل الخروج</button><div id="stats" class="stats"></div><h2>سيارات المعرض</h2><p id="notice"></p><div style="overflow:auto"><table><thead><tr><th>السيارة</th><th>السنة</th><th>السعر</th><th>منشورة</th><th>معتمدة</th><th>الإجراء</th></tr></thead><tbody id="rows"></tbody></table></div></div></section></main><script>let token=sessionStorage.getItem('carAgencyToken')||'';const err=document.getElementById('error');if(token){show().catch(()=>{sessionStorage.removeItem('carAgencyToken');token='';document.getElementById('login').style.display='block';document.getElementById('dashboard').style.display='none';});}async function req(path,options={}){const r=await fetch(path,{...options,headers:{...(options.body?{'Content-Type':'application/json'}:{}),Authorization:'Bearer '+token}});if(!r.ok)throw Error('HTTP '+r.status);return r.json()}async function show(){const d=await req('/api/dashboard'),vehicles=await req('/api/vehicles');document.getElementById('login').style.display='none';document.getElementById('dashboard').style.display='block';const stats=document.getElementById('stats');stats.replaceChildren();for(const [k,v] of Object.entries({السيارات:d.vehicles,المتاحة:d.available,العملاء:d.customers,المبيعات:d.sales})){const box=document.createElement('div');box.className='stat';box.textContent=k+' : '+v;stats.append(box)}const rows=document.getElementById('rows');rows.replaceChildren();for(const v of vehicles){const tr=document.createElement('tr');for(const val of [[v.make,v.model].join(' '),v.year,Number(v.price).toLocaleString('ar-EG'),v.isPublished?'نعم':'لا',v.isApproved?'نعم':'لا']){const td=document.createElement('td');td.textContent=val;tr.append(td)}const td=document.createElement('td');for(const [label,field,endpoint] of [['تغيير النشر','isPublished','publication'],['تغيير الاعتماد','isApproved','approval']]){const b=document.createElement('button');b.textContent=label;b.onclick=async()=>{try{await req('/api/vehicles/'+v.id+'/'+endpoint,{method:'PATCH',body:JSON.stringify({[field]:!v[field]})});await show()}catch(e){document.getElementById('notice').textContent='تعذر التعديل: '+e.message}};td.append(b)}tr.append(td);rows.append(tr)}}document.getElementById('loginForm').onsubmit=async e=>{e.preventDefault();err.textContent='';try{const r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:document.getElementById('username').value,password:document.getElementById('password').value})});if(!r.ok)throw Error('بيانات الدخول غير صحيحة أو الخدمة غير متاحة');const session=await r.json();token=session.accessToken;sessionStorage.setItem('carAgencyToken',token);if(session.role==='User'){token='';sessionStorage.removeItem('carAgencyToken');window.location.assign('/');return;}if(!['SuperAdmin','AgencyAdmin','Staff'].includes(session.role)){token='';sessionStorage.removeItem('carAgencyToken');err.textContent='هذا الحساب لا يملك صلاحية الدخول.';return;}await show()}catch(e){token='';err.textContent=e.message}};document.getElementById('logout').onclick=()=>{token='';document.getElementById('dashboard').style.display='none';document.getElementById('login').style.display='block'};</script></body></html>
