</style></head><body><main class="catalog"><div class="catalogHeader"><div><h1>جميع السيارات المستعملة</h1><p>السيارات المعتمدة والمنشورة في Car Agency</p></div><a class="catalogBack" href="/#used">العودة للرئيسية</a></div><p id="count" class="catalogCount">جارٍ تحميل السيارات...</p><div class="grid" id="cars"></div></main><script>
function card(v){const el=document.createElement('article');el.className='car';const photo=document.createElement('div');photo.className='photo';if(v.photoId){const img=document.createElement('img');img.src='/api/public/used-cars/'+encodeURIComponent(v.id)+'/photos/'+encodeURIComponent(v.photoId);img.alt=v.make+' '+(v.model||'');img.loading='lazy';photo.append(img)}else if(v.imageUrl&&/^https:\/\//i.test(v.imageUrl)){const img=document.createElement('img');img.src=v.imageUrl;img.alt=v.make+' '+(v.model||'');img.loading='lazy';photo.append(img)}else{photo.textContent='🚘'}const b=document.createElement('div');b.className='carBody';const tag=document.createElement('span');tag.className='carTag';tag.textContent='مستعملة';const h=document.createElement('h3');h.textContent=(v.make||'')+' '+(v.model||'');const p=document.createElement('div');p.className='price';p.textContent=Number(v.price||0).toLocaleString('ar-EG')+' ج.م';const f=document.createElement('div');f.className='foot';f.textContent='موديل '+(v.year||'');b.append(tag,h,p,f);el.append(photo,b);return el}
async function load(){const count=document.getElementById('count');try{const r=await fetch('/api/public/used-cars',{signal:AbortSignal.timeout(12000)});if(!r.ok)throw Error('HTTP '+r.status);const data=await r.json();if(!Array.isArray(data))throw Error('Invalid data');data.sort((a,b)=>(Date.parse(b.createdAt||b.submittedAt||0)||0)-(Date.parse(a.createdAt||a.submittedAt||0)||0));count.textContent=data.length+' سيارة مستعملة';const grid=document.getElementById('cars');for(const v of data)grid.append(card(v));if(!data.length)count.textContent='لا توجد سيارات مستعملة منشورة حاليًا'}catch(e){count.textContent='تعذر تحميل السيارات حاليًا. يرجى إعادة المحاولة.';console.error(e)}}load();
</script></body></html>
